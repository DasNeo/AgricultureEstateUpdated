name: Release merged Bannerlord update

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  target:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codex/bannerlord-')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.changed.outputs.release }}
    steps:
      - name: Confirm the version file was updated
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Fxq 'BannerlordVersion.props'; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: target
    if: needs.target.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      beta: ${{ steps.target.outputs.beta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Read reviewed target
        id: target
        shell: pwsh
        run: ./scripts/Read-ReleaseTarget.ps1
      - name: Build, test, and package the merged source
        id: package
        shell: pwsh
        env:
          BANNERLORD_VERSION: ${{ steps.target.outputs.package }}
        run: ./scripts/Build-Release.ps1 -BannerlordVersion $env:BANNERLORD_VERSION -Package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            artifacts/AgricultureEstate-*.zip
            artifacts/AgricultureEstate-*.zip.sha256
            artifacts/release-notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-validation
          path: |
            artifacts/build.log
            artifacts/tests.log
            artifacts/tests/
            artifacts/target.json

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: artifacts
      - name: Tag the reviewed commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          IS_BETA: ${{ needs.verify.outputs.beta }}
        run: |
          git tag "$RELEASE_TAG"
          gh auth setup-git
          git push origin "refs/tags/$RELEASE_TAG"
          flags=()
          if [ "$IS_BETA" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 \
            --verify-tag --latest=false --title "AgricultureEstate for $RELEASE_TAG" \
            --notes-file artifacts/release-notes.md "${flags[@]}"
